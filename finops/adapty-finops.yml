alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Adapty
serviceCategory: Analytics and Monetization
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
meters:
- name: monthly_tracked_revenue
  description: Subscription revenue flowing through apps on the platform, billed as a percentage of MTR above the free threshold.
  unit: usd
  aggregation: sum
  dimensions:
  - account
  - app
  - product
- name: addon_refund_saver
  description: Refund Saver add-on charge (free while under the MTR threshold).
  unit: contract
  aggregation: max
  dimensions:
  - account
- name: addon_adapty_ua
  description: Adapty UA add-on charge (free while under the MTR threshold).
  unit: contract
  aggregation: max
  dimensions:
  - account
- name: addon_apple_ads_manager
  description: Apple Ads Manager add-on charge (free while under the MTR threshold).
  unit: contract
  aggregation: max
  dimensions:
  - account
principles:
- name: Visibility
  description: Track MTR per app and product in Adapty analytics; understand which surfaces push you over the free threshold.
- name: Allocation
  description: Attribute tracked revenue to apps, products, and paywalls to map platform cost to the products that generate it.
- name: Optimization
  description: Enable only the add-ons you need; consolidate low-revenue apps; use the free tier fully while under the MTR threshold.
- name: Accountability
  description: Assign product owners responsibility for the revenue their apps track and the platform percentage that follows.
