- FOCUS
description: >-
  FinOps view of Adapty spend. Adapty bills on Monthly Tracked Revenue (MTR)
  rather than per-API-call: the platform (SDK, paywalls, A/B testing, remote
  config, analytics, and the Server-Side API) is free while MTR is under the
  $5,000/month threshold and billed at roughly 1% of tracked revenue above it,
  with optional add-ons priced individually and Enterprise custom-priced.
  Because cost scales with the revenue the platform tracks rather than with API
  volume, FinOps attention focuses on which apps/products drive tracked revenue
  and on add-on selection rather than on request metering.
notes: >-
  Percentage and threshold reflect Adapty's 2026 pricing; verify current figures
  on the Adapty pricing page during reconciliation. API usage (SDK and
  Server-Side API) is not a separate billable meter.
sources:
