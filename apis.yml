aid: adapty
url: https://raw.githubusercontent.com/api-evangelist/adapty/refs/heads/main/apis.yml
name: Adapty
kind: company
description: Adapty is a mobile in-app subscription platform for iOS, Android, Flutter,
  React Native, and Unity apps. Its core is a client SDK for paywalls, A/B testing,
  remote config, and server-side receipt validation, backed by a supporting Server-Side
  REST API for programmatically managing profiles, purchases and transactions,
  access levels (entitlements), and paywalls, plus webhooks and integrations for
  streaming subscription events to downstream analytics and marketing tools.
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
